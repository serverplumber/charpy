#:schema ./case.schema.json
# charpy v0 case catalogue -- sessioned era.
#
# v0 targets 2025-06-18 and 2025-11-25, where the deployed population is and
# where the classic gateway seam bugs live. See docs/design/revisions.md.
#
# Case IDs here are permanent. Revision and seed qualify them at citation
# time: stream/truncate-mid-event@2025-11-25#seed=8f2c1a
#
# A damaged frame is a question put to whoever receives it (ADR-013), so every
# case states its direction and the loader checks it reaches every subject the
# case names: c2s at the downstream face for a server, s2c at the upstream face
# for a client, and for a gateway the face it receives on.

schema_version = 1

# --- stream -----------------------------------------------------------------

[[case]]
id           = "stream/truncate-mid-event"
applies_to   = ">=2025-03-26"
subject      = ["client", "gateway"]
transport    = ["http"]
verdict      = "OBSERVED"
derives_from = "spec:2025-11-25/basic/transports#streamable-http"
summary      = "SSE stream cut inside an event's data field."

  [case.match]
  method     = "tools/call"
  face       = "upstream"
  direction  = "s2c"
  occurrence = 2
  scope      = "session"

  [case.fault]
  kind   = "truncate"
  cut_at = "mid_event"
  then   = "close"

  [case.expect]
  invariants               = ["id-resolves-once"]
  liveness_probe_within_ms = 30000

[[case]]
id           = "stream/truncate-event-boundary"
applies_to   = ">=2025-03-26"
subject      = ["client", "gateway"]
transport    = ["http"]
verdict      = "OBSERVED"
derives_from = "spec:2025-11-25/basic/transports#streamable-http"
summary      = "SSE stream stops cleanly between events; every event delivered was well formed."

  [case.match]
  method    = "tools/call"
  face      = "upstream"
  direction = "s2c"

  [case.fault]
  kind   = "truncate"
  cut_at = "event_boundary"
  then   = "close"

  [case.expect]
  invariants               = ["id-resolves-once"]
  liveness_probe_within_ms = 30000

[[case]]
id           = "stream/truncate-mid-line"
applies_to   = "*"
subject      = ["client"]
transport    = ["stdio"]
verdict      = "OBSERVED"
derives_from = "spec:2025-11-25/basic/transports#stdio"
summary      = "stdio frame cut before its terminating newline; the frame never delimits."

  [case.match]
  method    = "tools/call"
  face      = "upstream"
  direction = "s2c"

  [case.fault]
  kind   = "truncate"
  cut_at = "mid_line"
  then   = "stall"

[[case]]
id           = "stream/truncate-request-body"
applies_to   = ">=2025-03-26"
subject      = ["server", "gateway"]
transport    = ["http"]
verdict      = "OBSERVED"
derives_from = "spec:2025-11-25/basic/transports#sending-messages-to-the-server"
summary      = "A request body ends mid-frame, as a client that died mid-write leaves it; the server must reject it with an HTTP error and keep serving."

  [case.match]
  method    = "tools/call"
  face      = "downstream"
  direction = "c2s"
  kind      = "request"

  [case.fault]
  kind   = "truncate"
  cut_at = "mid_frame"

  [case.expect]
  expect_http_status       = 400
  liveness_probe_within_ms = 15000

# --- id ---------------------------------------------------------------------

[[case]]
id           = "id/duplicate-response"
applies_to   = "*"
subject      = ["client", "gateway"]
verdict      = "OBSERVED"
derives_from = "sep:0"
summary      = "The same request id is answered twice."

  [case.match]
  method    = "tools/call"
  face      = "upstream"
  direction = "s2c"
  kind      = "response"

  [case.fault]
  kind = "duplicate_id"
  mode = "double_response"

  [case.expect]
  invariants = ["id-resolves-once"]

[[case]]
id           = "id/duplicate-response-vary-type"
applies_to   = "*"
subject      = ["client", "gateway"]
observed_by  = ["differential"]
verdict      = "OBSERVED"
derives_from = "none"
summary      = "The id is answered as 7 and then as \"7\"; implementations disagree on whether these collide."

  [case.match]
  method    = "tools/call"
  face      = "upstream"
  direction = "s2c"
  kind      = "response"

  [case.fault]
  kind      = "duplicate_id"
  mode      = "double_response"
  vary_type = true

[[case]]
id           = "id/unsolicited-after-resolved"
applies_to   = "*"
subject      = ["client", "gateway"]
verdict      = "OBSERVED"
derives_from = "none"
summary      = "A late response arrives for an id that was correctly resolved earlier; finds pending-map leaks."

  [case.match]
  method     = "tools/call"
  face       = "upstream"
  direction  = "s2c"
  occurrence = 2

  [case.fault]
  kind      = "unsolicited_response"
  id_source = "already_resolved"

[[case]]
id           = "id/duplicate-request-inflight"
applies_to   = "*"
subject      = ["server", "gateway"]
verdict      = "OBSERVED"
derives_from = "none"
summary      = "The same request id arrives twice while the first is still in flight; what the server does with the second is the question."

  [case.match]
  method    = "tools/call"
  face      = "downstream"
  direction = "c2s"
  kind      = "request"

  [case.fault]
  kind = "duplicate_id"
  mode = "concurrent_request"

[[case]]
id           = "id/unsolicited-to-server"
applies_to   = "*"
subject      = ["server", "gateway"]
verdict      = "OBSERVED"
derives_from = "none"
summary      = "A response arrives for an id the server never used; it must be dropped, and the server must keep serving."

  [case.match]
  method    = "tools/call"
  face      = "downstream"
  direction = "c2s"
  kind      = "request"

  [case.fault]
  kind      = "unsolicited_response"
  id_source = "never_used"

# --- frame ------------------------------------------------------------------

[[case]]
id           = "frame/malformed-unbalanced"
applies_to   = "*"
subject      = ["client", "gateway"]
verdict      = "OBSERVED"
derives_from = "none"
summary      = "A frame with unbalanced braces; must not wedge the parser or the connection."

  [case.match]
  method    = "tools/call"
  face      = "upstream"
  direction = "s2c"

  [case.fault]
  kind = "malformed_json"

  [case.expect]
  liveness_probe_within_ms = 15000

[[case]]
id           = "frame/malformed-request"
applies_to   = "*"
subject      = ["server", "gateway"]
transport    = ["stdio"]
verdict      = "OBSERVED"
derives_from = "none"
summary      = "A request with unbalanced braces on a stdio line; JSON-RPC asks for a -32700 parse error, and the server must keep serving."

  [case.match]
  method    = "tools/call"
  face      = "downstream"
  direction = "c2s"
  kind      = "request"

  [case.fault]
  kind = "malformed_json"

  [case.expect]
  expect_error_code = -32700

[[case]]
id           = "frame/malformed-request-body"
applies_to   = ">=2025-03-26"
subject      = ["server", "gateway"]
transport    = ["http"]
verdict      = "OBSERVED"
derives_from = "spec:2025-11-25/basic/transports#sending-messages-to-the-server"
summary      = "A request body with unbalanced braces; the server must reject it with an HTTP error and keep serving."

  [case.match]
  method    = "tools/call"
  face      = "downstream"
  direction = "c2s"
  kind      = "request"

  [case.fault]
  kind = "malformed_json"

  [case.expect]
  expect_http_status       = 400
  liveness_probe_within_ms = 15000

# --- schema -----------------------------------------------------------------

[[case]]
id           = "schema/output-schema-violated"
applies_to   = ">=2025-06-18"
subject      = ["client", "gateway"]
verdict      = "OBSERVED"
derives_from = "schema:#/definitions/CallToolResult"
summary      = "structuredContent violates the outputSchema its server declared in tools/list; a client that validates results must not accept it."

  [case.match]
  method    = "tools/call"
  face      = "upstream"
  direction = "s2c"
  kind      = "response"

  [case.fault]
  kind   = "schema_violation"
  target = "declared_output_schema"
  how    = "wrong_type"

# --- manifest ---------------------------------------------------------------

[[case]]
id           = "manifest/mutate-silent"
applies_to   = "*"
subject      = ["gateway"]
verdict      = "OBSERVED"
derives_from = "none"
summary      = "A tool disappears upstream with no list_changed; gateways that poll rather than trust notifications should still converge."

  [case.match]
  method    = "notifications/tools/list_changed"
  face      = "upstream"
  direction = "s2c"
  kind      = "notification"

  [case.fault]
  kind   = "manifest_mutate"
  list   = "tools"
  op     = "remove"
  notify = "silent"

  [case.expect]
  invariants = ["merged-manifest-consistency"]

# --- gateway ----------------------------------------------------------------

[[case]]
id           = "gateway/upstream-credential-downstream"
applies_to   = "<2026-07-28"
subject      = ["gateway"]
verdict      = "OBSERVED"
derives_from = "none"
summary      = "An upstream credential or session id appears in a downstream frame."

  [case.match]
  face      = "upstream"
  direction = "s2c"
  kind      = "response"

  [case.fault]
  kind = "hang"
  scope = "response"
  withdraw_after_ms = 5000

  [case.expect]
  invariants = ["no-credential-leak", "session-identity-isolation"]

# --- lifecycle --------------------------------------------------------------

[[case]]
id           = "lifecycle/capability-narrowed-on-later-handshake"
applies_to   = "*"
subject      = ["client", "gateway"]
verdict      = "OBSERVED"
derives_from = "none"
summary      = "A later handshake in the run claims fewer capabilities than an earlier one; the peer uses only what that handshake advertised."

  [case.match]
  method     = "initialize"
  face       = "upstream"
  direction  = "s2c"
  kind       = "response"
  occurrence = 2
  scope      = "run"

  [case.fault]
  kind                = "capability_flip"
  field               = "capabilities"
  direction_of_change = "narrow"

  [case.expect]
  expect_negotiated_only = true

[[case]]
id           = "lifecycle/server-request-unanswered"
applies_to   = "<2026-07-28"
subject      = ["server", "gateway"]
transport    = ["stdio"]
verdict      = "OBSERVED"
derives_from = "none"
summary      = "The client holds back its answer to the server's own sampling request, then fails it; the server must answer its caller and keep serving."

  [case.match]
  method    = "sampling/createMessage"
  face      = "downstream"
  direction = "c2s"
  kind      = "response"

  [case.fault]
  kind              = "hang"
  scope             = "response"
  withdraw_after_ms = 2000
  then              = "error"
